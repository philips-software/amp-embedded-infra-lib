    '''external/crypto/tiny-aes128/TinyAes\.c''',
    '''services/network/WebSocket\.cpp''',
    '''services/network/CertificatesMbedTls\.cpp''',
    '''services/network/test_doubles/Certificates\.cpp''',
]
