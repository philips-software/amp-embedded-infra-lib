---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      minor-and-patch-action-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: .clusterfuzzlite
    schedule:
      interval: monthly
    groups:
      minor-and-patch-docker-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: .devcontainer
    schedule:
      interval: daily
    groups:
      minor-and-patch-docker-updates:
        update-types:
          - minor
          - patch
